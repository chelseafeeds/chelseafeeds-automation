name: ChelseaFeeds Correct Known Blogger Fact

on:
  workflow_run:
    workflows: ["ChelseaFeeds Auto Schedule Editorial Batch"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  correct:
    if: github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout correction script
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install correction dependency
        run: python -m pip install requests
      - name: Correct verified shot statistic in scheduled Blogger post
        env:
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
        run: python correct_known_blogger_posts.py
