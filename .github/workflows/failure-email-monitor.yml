name: ChelseaFeeds Failure Email Monitor

on:
  workflow_run:
    workflows:
      - Chelsea News Collection
      - ChelseaFeeds Evidence and Article Drafts
      - ChelseaFeeds Auto Schedule Editorial Batch
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: chelseafeeds-failure-email-monitor
  cancel-in-progress: false

jobs:
  notify:
    if: github.event_name == 'workflow_run' && contains(fromJSON('["failure","timed_out"]'), github.event.workflow_run.conclusion) && github.event.workflow_run.run_attempt >= 2
    runs-on: ubuntu-latest
    steps:
      - name: Checkout monitor
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Send failure alert by email
        env:
          MONITOR_EMAIL: omowahala91@gmail.com
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
        run: python .github/scripts/send_failure_alert.py
