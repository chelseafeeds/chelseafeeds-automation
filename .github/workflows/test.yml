name: ChelseaFeeds Automation Test

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run collector regression tests
        run: python collect_news.py --self-test

      - name: Run processor regression tests
        run: python process_news.py --self-test

      - name: Run featured-image sourcing and licence tests
        run: python generate_featured_images.py --self-test

      - name: Compile-check publishing integration
        run: python -m py_compile generate_featured_images.py upload_featured_image.py publish_article.py
