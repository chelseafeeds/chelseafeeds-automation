name: Chelsea News Collection

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */2 * * *"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Collect Chelsea news
        run: python collect_news.py

      - name: Save duplicate history to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen_stories.json
          git diff --cached --quiet || (
            git commit -m "Update ChelseaFeeds story history" &&
            git push
          )

      - name: Save collected news
        uses: actions/upload-artifact@v4
        with:
          name: chelsea-news-candidates
          path: |
            news_candidates.json
            collection_report.json
            seen_stories.json
          if-no-files-found: error
          retention-days: 7
