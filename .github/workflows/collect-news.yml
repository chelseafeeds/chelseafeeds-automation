name: Chelsea News Collection

on:
  push:
    branches: [main]
    paths:
      - "collect_news.py"
      - "persist_history.py"
      - "process_news.py"
      - "related_links.py"
      - "generate_featured_images.py"
      - ".github/workflows/process-news.yml"
      - "requirements.txt"
      - ".github/workflows/collect-news.yml"
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: chelseafeeds-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Test race-safe history merge
        run: python persist_history.py --self-test

      - name: Collect Chelsea news
        run: python collect_news.py

      - name: Merge and save duplicate history safely
        run: python persist_history.py

      - name: Save collected news
        uses: actions/upload-artifact@v4
        with:
          name: chelsea-news-candidates
          path: |
            news_candidates.json
            collection_report.json
            seen_stories.json
          if-no-files-found: error
          retention-days: 7
