name: Chelsea News Collection

on:
  push:
    branches: [main]
    paths:
      - "collect_news.py"
      - "direct_source_discovery.py"
      - "persist_history.py"
      - "process_news.py"
      - "seen_stories.json"
      - "related_links.py"
      - "generate_featured_images.py"
      - ".github/workflows/process-news.yml"
      - "requirements.txt"
      - ".github/workflows/collect-news.yml"
  workflow_dispatch:
  schedule:
    # Run every five minutes in UTC; GitHub may delay scheduled events during load.
    - cron: '*/5 * * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: chelseafeeds-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Test race-safe history merge
        run: python persist_history.py --self-test

      - name: Collect Chelsea news
        run: python collect_news.py

      - name: Discover direct official and specialist Chelsea sources
        run: python direct_source_discovery.py

      - name: Merge and save duplicate history safely
        run: python persist_history.py

      - name: Save collected news
        uses: actions/upload-artifact@v4
        with:
          name: chelsea-news-candidates
          path: |
            news_candidates.json
            collection_report.json
            seen_stories.json
          if-no-files-found: error
          retention-days: 7

      # workflow_run does not reliably chain from GITHUB_TOKEN-dispatched runs.
      # Explicitly start processing after a manual/watchdog collection artifact exists.
      - name: Dispatch evidence processing for manual or watchdog collections
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run process-news.yml --ref main \
            -f source_run_id="$GITHUB_RUN_ID" \
            -f recovery_approved=true
