name: ChelseaFeeds Publish Reviewed Article

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Successful ChelseaFeeds Evidence and Article Drafts run ID"
        required: true
        type: string
      event_id:
        description: "Exact event_id from blogger_ready_posts.json"
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: chelseafeeds-manual-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout publisher
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install publisher dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests requests-oauthlib beautifulsoup4 Pillow

      - name: Compile-check publisher scripts
        run: python -m py_compile generate_featured_images.py upload_featured_image.py publish_article.py

      - name: Download selected article batch
        uses: actions/download-artifact@v4
        with:
          name: chelseafeeds-editorial-results
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.source_run_id }}
          path: input

      - name: Upload and verify featured image
        id: featured_image
        env:
          ARTICLE_EVENT_ID: ${{ inputs.event_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: python upload_featured_image.py

      - name: Validate and save selected article as Blogger draft
        env:
          ARTICLE_EVENT_ID: ${{ inputs.event_id }}
          BLOGGER_PUBLISH_LIVE: "false"
          ENABLE_X_POSTING: "false"
          FEATURED_IMAGE_URL: ${{ steps.featured_image.outputs.image_url }}
          FEATURED_IMAGE_ALT: ${{ steps.featured_image.outputs.alt_text }}
          FEATURED_IMAGE_SOURCE_TYPE: ${{ steps.featured_image.outputs.source_type }}
          FEATURED_IMAGE_CREDIT_TEXT: ${{ steps.featured_image.outputs.credit_text }}
          FEATURED_IMAGE_CREDIT_URL: ${{ steps.featured_image.outputs.credit_url }}
          FEATURED_IMAGE_LICENSE_NAME: ${{ steps.featured_image.outputs.license_name }}
          FEATURED_IMAGE_LICENSE_URL: ${{ steps.featured_image.outputs.license_url }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
        run: python publish_article.py
