name: ChelseaFeeds Evidence and Article Drafts

on:
  workflow_run:
    workflows: ["Chelsea News Collection"]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: read

concurrency:
  group: chelseafeeds-editorial-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  process:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    env:
      AI_API_KEY: ${{ secrets.GROQ_API_KEY }}
      AI_PROVIDER: groq
      AI_BASE_URL: https://api.groq.com/openai/v1
      AI_MODEL: openai/gpt-oss-120b
      MAX_DRAFTS_PER_RUN: "3"
      MAX_SOURCE_PACK: "4"
      MAX_SOURCE_CHARS: "3500"
      IMAGE_PROVIDER: cloudflare
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_IMAGE_MODEL: "@cf/black-forest-labs/flux-1-schnell"
      MAX_IMAGES_PER_RUN: "6"
      IMAGE_STEPS: "4"

    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run processor regression tests
        run: python process_news.py --self-test

      - name: Download collector candidates
        uses: actions/download-artifact@v4
        with:
          name: chelsea-news-candidates
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
          path: input

      - name: Verify required secret injection (values never printed)
        run: |
          python - <<'PY'
          import os
          checks = {
              "CLOUDFLARE_ACCOUNT_ID": bool(os.getenv("CLOUDFLARE_ACCOUNT_ID", "").strip()),
              "CLOUDFLARE_API_TOKEN": bool(os.getenv("CLOUDFLARE_API_TOKEN", "").strip()),
              "GROQ_API_KEY": bool(os.getenv("AI_API_KEY", "").strip()),
          }
          for name, present in checks.items():
              print(f"{name}: {'present' if present else 'MISSING'}")
          if not all(checks.values()):
              raise SystemExit("Required secret injection check failed; no secret values were exposed.")
          PY

      - name: Run evidence checks, article quality gate and image generation
        run: |
          python process_news.py --input input/news_candidates.json --output output

      - name: Save editorial results and generated images
        uses: actions/upload-artifact@v4
        with:
          name: chelseafeeds-editorial-results
          path: |
            output/article_drafts.json
            output/editorial_report.json
            output/images/
          if-no-files-found: error
          retention-days: 7
