name: ChelseaFeeds Evidence and Article Drafts
run-name: ChelseaFeeds Processor | source=${{ github.event.workflow_run.id || inputs.source_run_id }} | trigger=${{ github.event_name }}

on:
  workflow_run:
    workflows: ["Chelsea News Collection"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Successful Chelsea News Collection run ID whose candidate artifact should be processed"
        required: true
        type: string
      recovery_approved:
        description: "Explicit safety acknowledgement required for manual recovery dispatches"
        required: false
        default: false
        type: boolean

permissions:
  actions: write
  contents: write

concurrency:
  group: chelseafeeds-editorial-queue
  # Never discard an active evidence-processing batch when another hourly collection completes.
  # GitHub queues the next run; event/history deduplication prevents duplicate article processing.
  cancel-in-progress: false

jobs:
  process:
    if: (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.event != 'workflow_dispatch') || (github.event_name == 'workflow_dispatch' && inputs.recovery_approved == true)
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      AI_API_KEY: ${{ secrets.GROQ_API_KEY }}
      AI_PROVIDER: groq
      AI_BASE_URL: https://api.groq.com/openai/v1
      AI_MODEL: openai/gpt-oss-120b
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      MAX_DRAFTS_PER_RUN: "15"
      MAX_SOURCE_PACK: "5"
      MAX_SOURCE_CHARS: "3500"
      MAX_COMPLETION_TOKENS: "2600"
      RUN_TOKEN_BUDGET: "150000"
      SOURCE_FETCH_WORKERS: "8"
      AI_REQUEST_TIMEOUT: "45"
      AI_MAX_ATTEMPTS: "2"
      AI_FALLBACK_ENABLED: "false"
      AI_FALLBACK_BASE_URL: https://api.openai.com/v1
      AI_FALLBACK_MODEL: gpt-4.1-mini

    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run processor regression tests
        run: python process_news.py --self-test

      - name: Test related internal-link safeguards and history persistence
        run: |
          python related_links.py --self-test
          python update_processing_history.py --self-test

      - name: Test source-photo preference and ChelseaFeeds logo fallback
        run: python generate_featured_images.py --self-test

      - name: Compile-check publishing integration
        run: python -m py_compile process_news.py related_links.py generate_featured_images.py upload_featured_image.py publish_article.py update_processing_history.py

      - name: Download collector candidates
        uses: actions/download-artifact@v4
        with:
          name: chelsea-news-candidates
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id || inputs.source_run_id }}
          path: input

      - name: Run evidence checks and article quality gate
        run: |
          python process_news.py --input input/news_candidates.json --output output

      - name: Use relevant source-article photos, with ChelseaFeeds logo fallback
        run: python generate_featured_images.py --output output

      - name: Save editorial results and generated images
        uses: actions/upload-artifact@v4
        with:
          name: chelseafeeds-editorial-results
          path: |
            output/article_drafts.json
            output/blogger_ready_posts.json
            output/editorial_report.json
            output/images/
          if-no-files-found: error
          retention-days: 7

      - name: Persist completed editorial outcomes and prevent duplicate hourly drafts
        run: |
          python update_processing_history.py --report output/editorial_report.json
          python persist_history.py

      # Continue the chain explicitly when this processor was started by the
      # manual/watchdog dispatch path, which can suppress downstream workflow_run events.
      - name: Dispatch Blogger scheduling for manual or watchdog processing
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run auto-schedule-editorial-batch.yml --ref main \
            -f source_run_id="$GITHUB_RUN_ID" \
            -f recovery_approved=true
