name: ChelseaFeeds Auto Schedule Editorial Batch

on:
  workflow_run:
    workflows: ["ChelseaFeeds Evidence and Article Drafts"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Successful ChelseaFeeds editorial processing run ID"
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: chelseafeeds-auto-schedule
  cancel-in-progress: false

jobs:
  schedule:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout publisher
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install publisher dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests requests-oauthlib beautifulsoup4 Pillow

      - name: Compile-check publisher scripts
        run: python -m py_compile upload_featured_image.py publish_article.py x_publish_when_live.py

      - name: Download editorial batch
        uses: actions/download-artifact@v4
        with:
          name: chelseafeeds-editorial-results
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id || inputs.source_run_id }}
          path: input

      - name: Schedule articles and announce only after Blogger confirms LIVE
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_REF_NAME: main
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_AUTO_SCHEDULE_MINUTES: "5"
          BLOGGER_INPUT_DIR: input
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: |
          set -euo pipefail
          python - <<'PY' > "$RUNNER_TEMP/event_ids.txt"
          import json
          with open("input/blogger_ready_posts.json", encoding="utf-8") as f:
              payload = json.load(f)
          posts = payload.get("posts", []) if isinstance(payload, dict) else payload
          for post in posts:
              event_id = str(post.get("event_id", "")).strip()
              if event_id and post.get("auto_schedule_eligible") is True:
                  print(event_id)
              elif event_id:
                  print(f"HELD: {event_id} does not meet the automatic-scheduling evidence threshold.", file=__import__("sys").stderr)
          PY

          if [ ! -s "$RUNNER_TEMP/event_ids.txt" ]; then
            echo "No eligible Blogger-ready articles in this batch."
            exit 0
          fi

          pids=()
          while IFS= read -r event_id; do
            [ -n "$event_id" ] || continue
            echo "Preparing Blogger article event: $event_id"

            image_output="$RUNNER_TEMP/image-$event_id"
            publish_output="$RUNNER_TEMP/publish-$event_id"
            : > "$image_output"
            : > "$publish_output"

            ARTICLE_EVENT_ID="$event_id" GITHUB_OUTPUT="$image_output" python upload_featured_image.py

            image_url="$(sed -n 's/^image_url=//p' "$image_output")"
            image_alt="$(sed -n 's/^alt_text=//p' "$image_output")"
            image_source_type="$(sed -n 's/^source_type=//p' "$image_output")"
            image_credit_text="$(sed -n 's/^credit_text=//p' "$image_output")"
            image_credit_url="$(sed -n 's/^credit_url=//p' "$image_output")"
            image_license_name="$(sed -n 's/^license_name=//p' "$image_output")"
            image_license_url="$(sed -n 's/^license_url=//p' "$image_output")"

            ARTICLE_EVENT_ID="$event_id" \
            FEATURED_IMAGE_URL="$image_url" \
            FEATURED_IMAGE_ALT="$image_alt" \
            FEATURED_IMAGE_SOURCE_TYPE="$image_source_type" \
            FEATURED_IMAGE_CREDIT_TEXT="$image_credit_text" \
            FEATURED_IMAGE_CREDIT_URL="$image_credit_url" \
            FEATURED_IMAGE_LICENSE_NAME="$image_license_name" \
            FEATURED_IMAGE_LICENSE_URL="$image_license_url" \
            GITHUB_OUTPUT="$publish_output" \
            python publish_article.py

            post_id="$(sed -n 's/^post_id=//p' "$publish_output")"
            if [ -z "$post_id" ]; then
              echo "Missing Blogger post ID; refusing to post to X."
              exit 1
            fi

            meta="$(python - "$event_id" <<'PY'
          import json, sys
          event_id=sys.argv[1]
          payload=json.load(open("input/blogger_ready_posts.json",encoding="utf-8"))
          posts=payload.get("posts",[]) if isinstance(payload,dict) else payload
          matches=[p for p in posts if str(p.get("event_id",""))==event_id]
          if len(matches)!=1: raise SystemExit("Article metadata did not resolve uniquely")
          p=matches[0]
          image=p.get("featured_image") or {}
          print(json.dumps({"title":p.get("title",""),"labels":p.get("labels",[]),"image_path":"input/"+image.get("local_path","")}))
          PY
          )"
            title="$(python -c 'import json,sys; print(json.loads(sys.argv[1])["title"])' "$meta")"
            labels="$(python -c 'import json,sys; print(json.dumps(json.loads(sys.argv[1]).get("labels",[])))' "$meta")"
            thumbnail="$(python -c 'import json,sys; print(json.loads(sys.argv[1])["image_path"])' "$meta")"

            echo "Waiting for Blogger to confirm LIVE before X announcement: $event_id"
            BLOGGER_POST_ID="$post_id" \
            ARTICLE_TITLE="$title" \
            ARTICLE_LABELS_JSON="$labels" \
            ARTICLE_THUMBNAIL_PATH="$thumbnail" \
            python x_publish_when_live.py > "$RUNNER_TEMP/x-$event_id.log" 2>&1 &
            pids+=("$!")
          done < "$RUNNER_TEMP/event_ids.txt"

          x_failed=0
          for pid in "${pids[@]}"; do
            if ! wait "$pid"; then x_failed=1; fi
          done
          for log in "$RUNNER_TEMP"/x-*.log; do
            [ -f "$log" ] && cat "$log"
          done
          if [ "$x_failed" -ne 0 ]; then
            echo "At least one X announcement failed or did not confirm Blogger LIVE."
            exit 1
          fi
